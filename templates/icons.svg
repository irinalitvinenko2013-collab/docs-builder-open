<!-- Набор иконок (inline SVG-спрайт). pdf-builder вставляет ВСЁ содержимое <svg>…</svg>
     в начало <body> guide.html, затем использует: <svg class="ic"><use href="#growth"/></svg>
     Иконки монохромные через currentColor — цвет задаётся CSS (color:var(--burgundy)/var(--gold)).
     Базовый стиль значка:
       .ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;
           stroke-linecap:round;stroke-linejoin:round;color:var(--burgundy);} -->
